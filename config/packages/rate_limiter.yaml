framework:
    rate_limiter:
        # Checking an SMS code: 5 attempts per account every 15 minutes.
        # 900,000 possible codes => brute force becomes impractical.
        verification_code_check:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
            # symfony/lock is not installed: without a lock, two simultaneous requests
            # may both be counted as accepted. Acceptable here; install symfony/lock
            # and remove this line if strict counting is needed.
            lock_factory: null

        # Sending an SMS costs money: 3 sends per account per hour.
        verification_code_send:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
            lock_factory: null

        # Registration sends an SMS too: 5 accounts per client IP per hour.
        # Behind a reverse proxy, configure framework.trusted_proxies or every
        # visitor will share the proxy's IP.
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            lock_factory: null
